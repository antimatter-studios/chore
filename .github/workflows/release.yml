name: Release

# Tag-driven: pushing v1.2.3 cross-builds every platform, publishes a release with
# checksums, and then proves the build was reproducible.
#
# The build itself lives in .goreleaser.yml — targets, flags, ldflags and artifact
# names are all there, including WHY each flag exists. This file only drives it and
# adds the two things goreleaser does not do (see the last two steps).
#
# workflow_dispatch has no version input: the version comes from the tag goreleaser
# sees, so a hand-typed one could not be honoured. To re-run a release, dispatch this
# workflow with the TAG selected as the ref.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version and the changelog range from tags, and
          # stamps the commit date into the binary — none of which a shallow clone has.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned exactly, not `latest`: goreleaser builds the artifact users install,
          # so it is part of the supply chain. It also writes the tar archives, whose
          # bytes the reproduction step below compares — a silent upgrade could change
          # them. This is the version the config was verified against.
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the exact toolchain patch, not just the minor: go1.25.0 and go1.25.6
          # emit different binaries, so without this nobody can reproduce the artifact
          # even with the right source and flags.
          GOTOOLCHAIN: go1.25.0

      - name: Check the version stamp
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Verify the stamp on the ONE target this runner can execute. The others are
          # cross-builds — a linux host cannot run a darwin binary — and all four come
          # from the same config, so proving it once proves the recipe. Reading the
          # stamp out of a foreign binary was tried and does not work: `go version -m`
          # does not record -ldflags.
          #
          # The Homebrew formula's own test runs `chore --version` on the user's
          # machine, which is where a broken darwin artifact would surface.
          ./dist/chore_linux_amd64_v1/chore --version | grep -qx "${VER}" || {
            echo "the built binary does not report ${VER}" >&2
            exit 1
          }

      - name: Publish binary checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # goreleaser's checksums.txt covers the ARCHIVES. This covers the binaries
          # INSIDE them, which is what the reproduction step can actually compare: two
          # runs produce identical binaries, and with mod_timestamp identical archives
          # too, but only the binary hash is independent of how it was packaged.
          mkdir -p unpacked
          for t in dist/*.tar.gz; do
            n=$(basename "$t" .tar.gz)
            tar xzf "$t" -O chore > "unpacked/$n"
          done
          # Single space, matching the format published since the first release.
          (cd unpacked && sha256sum -- * | sed 's|  | |') | tee binaries.txt
          gh release upload "${GITHUB_REF_NAME}" binaries.txt --clobber

      # Prove the claim rather than asserting it: rebuild every target from this same
      # commit and require the binaries to be byte-identical to the ones just
      # published. If a future change makes the build non-reproducible — a timestamp,
      # an absolute path, an unpinned toolchain — this fails here, instead of a user
      # discovering it while trying to verify a release.
      #
      # `build` rather than `release`, so nothing is published a second time. It wipes
      # dist, which is why binaries.txt is written to the workspace root above.
      - name: Reproduce the release independently
        env:
          GOTOOLCHAIN: go1.25.0
        run: |
          set -euo pipefail
          goreleaser build --clean
          fail=0
          while read -r want name; do
            # dist layout is chore_<goos>_<goarch>_<variant>/chore; map the published
            # artifact name back onto it. Names are chore-<version>-<os>-<arch>.
            arch=${name##*-}
            rest=${name%-*}
            os=${rest##*-}
            case "$arch" in
              x86_64) goarch=amd64_v1 ;;
              arm64) goarch=arm64_v8.0 ;;
              *) goarch="$arch" ;;
            esac
            got=$(sha256sum "dist/chore_${os}_${goarch}/chore" | cut -d" " -f1)
            if [ "$got" = "$want" ]; then
              echo "  ${os}/${arch}: reproduced"
            else
              echo "  ${os}/${arch}: MISMATCH published=${want} rebuilt=${got}" >&2
              fail=1
            fi
          done < binaries.txt
          [ "$fail" = 0 ]

      # No step here notifies the Homebrew tap, deliberately.
      #
      # The tap is a PULL consumer: its tap-sync workflow is triggered by a human,
      # reads this repository's public releases, and opens an unmerged PR for review.
      # Nothing that reaches `brew install` is published without someone looking at it,
      # and no project — including this one — holds a credential that can write there.
      # goreleaser's `brews:` block would invert that, which is why it is not used.
      #
      # To publish this release to brew: run "Sync formulae from releases" in
      # antimatter-studios/homebrew-tap, then merge the PR it opens.
