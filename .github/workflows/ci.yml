name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both platforms, because the one thing this program deliberately does not
    # abstract is the shell: it runs the system bash rather than an embedded
    # interpreter, so its behaviour has to be verified where it will run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Lint the workflows themselves. actionlint is fetched as a release binary
      # and checked against the sha256 the project publishes — the same
      # verification the Homebrew tap performs on the artifacts it installs, and
      # the reason this needs no third-party action.
      - name: Lint workflows
        if: matrix.os == 'ubuntu-latest'
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "${base}/${asset}"
          # Verify against the checksums file the release publishes, rather than a
          # hash pasted here that nobody re-checks when the version moves.
          curl -fsSL -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" actionlint
          ./actionlint .github/workflows/*.yml

      - name: Formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # scripts/ manipulates PATH in the developer's own shell, where a mistake
      # is annoying to diagnose and easy to ship — nothing else exercises them.
      # ubuntu only: shellcheck is preinstalled there, not on the macOS runners.
      - name: ShellCheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # -s bash because they are sourced by bash OR zsh and carry one guarded
          # zsh-only expansion, silenced in place.
          shellcheck -s bash -S warning scripts/*
          # They must also PARSE under bash even though the zsh branch never runs
          # there — a sourced file is parsed whole before any of it executes.
          for f in scripts/*; do bash -n "$f"; done
          echo "scripts ok"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /tmp/chore . && /tmp/chore --version
