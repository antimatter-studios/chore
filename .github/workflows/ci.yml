name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Both platforms, because the one thing this program deliberately does not
    # abstract is the shell: it runs the system bash rather than an embedded
    # interpreter, so its behaviour has to be verified where it will run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Lint the workflows themselves. actionlint is fetched as a release binary
      # and checked against the sha256 the project publishes — the same
      # verification the Homebrew tap performs on the artifacts it installs, and
      # the reason this needs no third-party action.
      - name: Lint workflows
        if: matrix.os == 'ubuntu-latest'
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "${base}/${asset}"
          # Verify against the checksums file the release publishes, rather than a
          # hash pasted here that nobody re-checks when the version moves.
          curl -fsSL -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" actionlint
          ./actionlint .github/workflows/*.yml

      # Branch protection names ONE check, `ci-ok`, and this is what keeps that
      # honest: ci-ok has to need every job in this file, and .github-guard has
      # to require ci-ok and nothing else. Beside actionlint because it is the
      # same kind of check — this file linted against what it claims to gate.
      # The script is the siblings' copy; see its header and .github-guard.
      - name: The one required check stands for every job
        if: matrix.os == 'ubuntu-latest'
        run: scripts/ci-gate.sh

      # The half no file can hold: the protection main actually has. It WARNS
      # rather than fails, deliberately. A setting is not in the diff, so a pull
      # request that went red here would be blamed for something it cannot fix —
      # and the safe order of a change (the job lands, then protection moves to
      # it) always has a window where the two disagree. The warning is what
      # says the second half has not happened yet. Classic protection only:
      # a ruleset's required checks are not in this response.
      - name: Live protection matches .github-guard
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          want=$(git config -f .github-guard --get-all checks.required | LC_ALL=C sort | paste -sd, -)
          if ! have=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" \
              --jq '.protection.required_status_checks.contexts // [] | sort | join(",")'); then
            echo "::warning::could not read protection on ${DEFAULT_BRANCH}; not compared"
            exit 0
          fi
          if [ "$want" != "$have" ]; then
            echo "::warning::${DEFAULT_BRANCH} requires [${have}] but .github-guard says [${want}] — apply .github-guard to branch protection"
          else
            echo "protection on ${DEFAULT_BRANCH} requires [${have}], as .github-guard says"
          fi

      - name: Formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # scripts/ manipulates PATH in the developer's own shell, where a mistake
      # is annoying to diagnose and easy to ship — nothing else exercises them.
      # ci-gate.sh is here too: a program rather than a sourced file, but a
      # guard is the last place a shell bug should go unlinted.
      # ubuntu only: shellcheck is preinstalled there, not on the macOS runners.
      - name: ShellCheck scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # -s bash because they are sourced by bash OR zsh and carry one guarded
          # zsh-only expansion, silenced in place.
          shellcheck -s bash -S warning scripts/*
          # They must also PARSE under bash even though the zsh branch never runs
          # there — a sourced file is parsed whole before any of it executes.
          for f in scripts/*; do bash -n "$f"; done
          # The install action's script is executed, not sourced, and is bash
          # only, so it takes its dialect from its shebang.
          shellcheck -S warning .github/actions/install/install.sh
          echo "scripts ok"

      # The manual is extracted from `chore:manual` comment blocks. Regenerating
      # and diffing is what actually keeps it in sync — a doc beside the code
      # still rots if nothing checks it.
      - name: Manual is in sync
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go run ./internal/manual/gen
          if ! git diff --quiet -- internal/manual/topics; then
            echo "the built-in manual is out of date — run 'chore manual' and commit:" >&2
            git --no-pager diff -- internal/manual/topics >&2
            exit 1
          fi
          echo "manual is in sync"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /tmp/chore . && /tmp/chore --version

      # Run the curated examples against the BUILT BINARY, not the library. Same
      # golden files, so a difference is a packaging fault — a missing embed, a
      # bad linker stamp — that no in-process test can see. The built-in manual
      # is embedded, and this is what proves it survived the build.
      - name: Examples against the built binary
        env:
          CHORE_BIN: /tmp/chore
        run: go test ./examples -count=1

  # The install action is what other repositories run to get chore, so it is
  # tested the way they use it: against a PUBLISHED release, on both platforms a
  # release ships. It downloads its default version, so a default naming a
  # release that does not exist, or a change to the asset name in
  # .goreleaser.yml that the action did not follow, fails here and not in a
  # consumer's CI.
  install-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: install
        uses: ./.github/actions/install

      # `chore` resolved through PATH, not the output path: that it is found at
      # all is the check that the destination reached GITHUB_PATH.
      - name: Installed chore is on PATH and reports the output version
        env:
          WANT_VERSION: ${{ steps.install.outputs.version }}
          WANT_PATH: ${{ steps.install.outputs.path }}
        run: |
          set -euo pipefail
          got="$(chore --version | head -n 1)"
          echo "chore --version: $got; output version: $WANT_VERSION"
          if [ -z "$WANT_VERSION" ] || [ "$got" != "$WANT_VERSION" ]; then
            echo "chore --version reports '$got', the action's output says '$WANT_VERSION'" >&2
            exit 1
          fi
          [ "$(command -v chore)" = "$WANT_PATH" ] || {
            echo "chore resolves to $(command -v chore), the action's output says $WANT_PATH" >&2
            exit 1
          }

      # The failure path is half the reason the action exists: an unreleased
      # version must fail the step, not leave a job that looks installed.
      - id: missing
        name: An unreleased version fails
        uses: ./.github/actions/install
        continue-on-error: true
        with:
          version: "0.0.0"
          destination: ${{ runner.temp }}/should-not-exist

      - name: Check the unreleased version failed
        env:
          OUTCOME: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = failure ] || {
            echo "installing chore 0.0.0 did not fail (outcome: $OUTCOME)" >&2
            exit 1
          }
          echo "an unreleased version fails, as it should"

  ci-ok:
    name: ci-ok
    # THE ONE REQUIRED CHECK (#54). Branch protection used to name the two
    # matrix legs by hand, `test (ubuntu-latest)` and `test (macos-latest)` —
    # exactly the names that move when a leg is added or the job is renamed.
    # Requiring this instead means the jobs behind it can change without
    # leaving a required check that never reports, which GitHub reads as
    # permanently pending, with enforce_admins on and nothing to point at.
    #
    # `if: always()` because without it a cancelled or skipped job leaves this
    # skipped too, and a skipped required check never reports. It judges every
    # result instead: anything but `success` fails, since a job that was skipped
    # or cancelled is not a job that passed. `needs.test.result` is the whole
    # matrix's, so one red leg is enough.
    #
    # It runs no work of its own, deliberately: it is a claim about the other
    # jobs, so it must not be able to pass anything off as theirs. A job added
    # to this file goes in `needs:` below, or scripts/ci-gate.sh fails.
    if: always()
    needs: [test, install-action]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
