version: "3"

# chore's own chores. Yes, it drives itself.

vars:
  # The exact compiler the release is built with. A different patch release of
  # Go emits a different binary, so reproducing a release means matching this.
  GOTOOLCHAIN_PIN: go1.25.0

tasks:
  build:
    desc: Build the binary into bin/
    sources: ['**/*.go', go.mod, go.sum]
    generates: [bin/chore]
    cmds:
      - go build -o bin/chore .

  manual:
    desc: Regenerate the built-in manual from the chore:manual comment blocks
    sources: ['**/*.go']
    generates: ['internal/manual/topics/*.md']
    cmds:
      - go run ./internal/manual/gen

  manual:check:
    desc: Fail if the built-in manual is out of date with the source
    cmds:
      # The whole point of extracting the manual from comments is that the two
      # cannot drift. Nothing enforces that except regenerating and diffing, so
      # this runs in CI and is the only thing standing between "beside the code"
      # and "beside the code, and wrong".
      - task: manual
      - |
        if ! git diff --quiet -- internal/manual/topics; then
          echo "the built-in manual is out of date — run 'chore manual' and commit:" >&2
          git --no-pager diff --stat -- internal/manual/topics >&2
          exit 1
        fi
        echo "manual is in sync"

  test:
    desc: Run the tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:installed:
    desc: Run the curated examples against the built binary rather than the library
    deps: [build]
    cmds:
      # Same goldens as `chore test`, driven through the artifact people install.
      # A difference between the two is a packaging fault — a missing embed, a
      # bad stamp — which an in-process test cannot see by construction.
      - CHORE_BIN="$PWD/bin/chore" go test ./examples -count=1

  lint:
    desc: gofmt and vet
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt would change:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - go vet ./...

  verify-release:
    desc: 'Rebuild a published release and compare hashes: chore verify-release 0.1.0'
    args:
      - name: version
        desc: released version, without the leading v
      - name: os
        desc: darwin or linux
      - name: arch
        desc: arm64 or x86_64
    vars:
      os: darwin
      arch: arm64
    cmds:
      - |
        set -euo pipefail
        # Trusting the pipeline is optional if you can rebuild what it published
        # and get the same bytes. This does exactly that, from the tag.
        case "{{.ARCH}}" in x86_64) goarch=amd64 ;; *) goarch="{{.ARCH}}" ;; esac
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT

        echo "  fetching the published binary hash"
        curl -fsSL "https://github.com/antimatter-studios/chore/releases/download/v{{.VERSION}}/binaries.txt" \
          -o "$work/binaries.txt"
        want=$(grep " chore-{{.VERSION}}-{{.OS}}-{{.ARCH}}$" "$work/binaries.txt" | cut -d' ' -f1)
        [ -n "$want" ] || { echo "  no entry for {{.OS}}-{{.ARCH}} in that release" >&2; exit 1; }

        echo "  rebuilding v{{.VERSION}} with {{.GOTOOLCHAIN_PIN}}"
        git worktree add -q --detach "$work/src" "v{{.VERSION}}"

        # The build stamps the COMMIT's date, so reproducing it means deriving the
        # same string — and the format changed when the release moved to goreleaser:
        # it renders .CommitDate in UTC, where the hand-written pipeline used git's
        # %cI and kept the committer's local offset. Same instant, different bytes.
        #
        # Which one a release used is not recorded anywhere, so both are tried and
        # the winner is named. A match is still a match against the PUBLISHED hash;
        # trying two known recipes cannot manufacture one.
        utc=$(cd "$work/src" && git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)
        local_offset=$(cd "$work/src" && git log -1 --format=%cI)

        got=""
        for recipe in "goreleaser:$utc" "pre-goreleaser:$local_offset"; do
          name=${recipe%%:*}
          date=${recipe#*:}
          ( cd "$work/src" && GOOS={{.OS}} GOARCH="$goarch" CGO_ENABLED=0 \
              GOTOOLCHAIN={{.GOTOOLCHAIN_PIN}} \
              TZ=UTC go build -buildvcs=false -trimpath \
                -ldflags "-s -w -X main.version={{.VERSION}} -X main.buildDate=$date" \
                -o "$work/rebuilt" . )
          got=$(shasum -a 256 "$work/rebuilt" | cut -d' ' -f1)
          if [ "$want" = "$got" ]; then
            recipe_used="$name"
            break
          fi
        done
        git worktree remove --force "$work/src"

        echo "  published: $want"
        echo "  rebuilt:   $got"
        if [ "$want" = "$got" ]; then
          echo "  ✓ reproduced — the release matches its source (${recipe_used} recipe)"
        else
          echo "  ✗ MISMATCH — the published binary is not what this source builds" >&2
          exit 1
        fi
